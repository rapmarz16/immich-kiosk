name: GHCR Zmanim Test

on:
  push:
    branches:
      - feature/davening-times-overlay
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/immich-kiosk
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VERSION="zmanim-test-${{ github.sha }}"

          docker buildx build --build-arg VERSION=$VERSION \
            --platform linux/amd64,linux/arm64 \
            --push \
            --label "org.opencontainers.image.created=$TIMESTAMP" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.authors=${{ github.repository_owner }}" \
            -t $IMAGE_NAME:zmanim-test \
            -t $IMAGE_NAME:feature-davening-times-overlay \
            .
